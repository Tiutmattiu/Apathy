name: Apply Guided V5 once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/app-v5-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V5 patch to the complete app.js
        env:
          PATCH_B64: >-
            
        run: |
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/app-v5.patch
          git apply --check /tmp/app-v5.patch
          git apply /tmp/app-v5.patch
          node --check app.js
          grep -q 'function start(flow)' app.js
          grep -q 'APATHY GUIDED SELF-ASSESSMENT — V5 RELEASE CANDIDATE' app.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'Integrate Guided V5 into complete app.js'
          git push
