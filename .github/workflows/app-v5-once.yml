name: Finalize Guided V5 once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/app-v5-once.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize version and cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          assert 'APATHY GUIDED SELF-ASSESSMENT — V5 RELEASE CANDIDATE' in s
          assert 'function start(flow)' in s
          s=s.replace("const GUIDED_FLOW_BUILD='GUIDED-SELF-2026-09-10-V4-RC-CANTONESE-MOBILE';","const GUIDED_FLOW_BUILD='GUIDED-SELF-2026-09-12-V5-FINAL';")
          p.write_text(s,encoding='utf-8')
          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8')
          h=re.sub(r'app\.js\?v=[^\"\']+', 'app.js?v=11.0.5-guided-v5-20260912', h)
          idx.write_text(h,encoding='utf-8')
          PY
          node --check app.js
          grep -q 'function start(flow)' app.js
          grep -q 'GUIDED-SELF-2026-09-12-V5-FINAL' app.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html
          git commit -m 'Finalize complete Guided V5 frontend'
          git push
